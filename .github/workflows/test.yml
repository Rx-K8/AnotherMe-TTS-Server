name: Test

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "app/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test.yml"
  pull_request:
    types:
      - opened
      - synchronize
    paths:
      - "app/**/*.py"
      - "tests/**/*.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest tests/ -v --tb=short --cov --cov-report=term-missing --cov-report=html

      - name: Store coverage files
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov
          include-hidden-files: true

      - name: Coverage report
        run: uv run coverage report

      - name: Extract coverage percentage
        id: coverage
        run: |
          COVERAGE=$(uv run coverage report --format=total | cut -d. -f1)
          echo "percentage=$COVERAGE" >> $GITHUB_OUTPUT

      - name: Generate coverage badge
        run: |
          COVERAGE=${{ steps.coverage.outputs.percentage }}
          if [ "$COVERAGE" -ge 80 ]; then
            COLOR="brightgreen"
          elif [ "$COVERAGE" -ge 60 ]; then
            COLOR="yellow"
          elif [ "$COVERAGE" -ge 40 ]; then
            COLOR="orange"
          else
            COLOR="red"
          fi
          curl -s "https://img.shields.io/badge/coverage-${COVERAGE}%25-${COLOR}" > .github/badges/coverage-badge.svg

      - name: Commit coverage badge
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/badges/coverage-badge.svg
          git diff --staged --quiet || git commit -m "📊 Update coverage badge"
          git pull --rebase
          git push
