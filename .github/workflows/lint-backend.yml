name: Lint Backend

on:
  push:
    branches:
      - main
    paths:
      - "app/**/*.py"
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
    paths:
      - "app/**/*.py"

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Set up Python
        run: uv python install 3.10
      - name: Install dependencies
        run: uv sync --group dev
      - name: Run lint
        run: uv run bash scripts/lint.sh
