name: Lint Backend

on:
  push:
    branches:
      - main
    paths:
      - "app/**/*.py"
  pull_request:
    branches:
      - main
      - develop
    types:
      - opened
      - synchronize
    paths:
      - "app/**/*.py"

jobs:
  lint-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment-dev.yml
          activate-environment: anotherme_tts_dev
          auto-activate-base: false
      - name: Run lint
        run: bash scripts/lint.sh
