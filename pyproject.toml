[project]
name = "anotherme-tts-server"
version = "0.1.0"
description = "AnotherMe TTS Server with CosyVoice"
readme = "README.md"
requires-python = "==3.10.*"
dependencies = [
    "conformer==0.3.2",
    "deepspeed==0.15.1 ; sys_platform == 'linux'",
    "diffusers==0.29.0",
    "fastapi==0.115.6",
    "fastapi-cli==0.0.4",
    "gdown==5.1.0",
    "gradio==5.4.0",
    "grpcio==1.57.0",
    "grpcio-tools==1.57.0",
    "hydra-core==1.3.2",
    "hyperpyyaml==1.2.2",
    "inflect==7.3.1",
    "librosa==0.10.2",
    "lightning==2.2.4",
    "matplotlib==3.7.5",
    "modelscope==1.20.0",
    "networkx==3.1",
    "omegaconf==2.3.0",
    "onnx==1.16.0",
    "onnxruntime==1.18.0 ; sys_platform == 'darwin' or sys_platform == 'win32'",
    "onnxruntime-gpu==1.18.0 ; sys_platform == 'linux'",
    "openai-whisper==20231117",
    "protobuf==4.25",
    "pyarrow==18.1.0",
    "pydantic==2.7.0",
    "pyworld==0.3.4",
    "rich==13.7.1",
    "ruamel-yaml<0.19",
    "soundfile==0.12.1",
    "tensorboard==2.14.0",
    "tensorrt-cu12-bindings==10.0.1 ; sys_platform == 'linux'",
    "tensorrt-cu12-libs==10.0.1 ; sys_platform == 'linux'",
    "torch==2.3.1",
    "torchaudio==2.3.1",
    "transformers==4.51.3",
    "uvicorn==0.30.0",
    "wetext==0.0.4",
    "wget==3.2",
]

[dependency-groups]
dev = [
    "mypy==1.19.1",
    "pre-commit>=4.5.1",
    "ruff==0.14.14",
    "types-aiofiles>=25.1.0.20251011",
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[[tool.uv.index]]
name = "onnxruntime-cuda12"
url = "https://aiinfra.pkgs.visualstudio.com/PublicPackages/_packaging/onnxruntime-cuda-12/pypi/simple/"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }
onnxruntime-gpu = { index = "onnxruntime-cuda12" }
tensorrt-cu12-bindings = { index = "nvidia" }
tensorrt-cu12-libs = { index = "nvidia" }

[tool.mypy]
strict = true
exclude = ["venv", ".venv", "third_party"]

[[tool.mypy.overrides]]
module = [
    "pydub",
    "pydub.*",
    "torchaudio",
    "torchaudio.*",
    "cosyvoice",
    "cosyvoice.*",
]
ignore_missing_imports = true
follow_untyped_imports = false

[tool.ruff]
target-version = "py310"
line-length = 88  # Blackのデフォルトと同じ

[tool.ruff.lint]
select = [
    "E",      # pycodestyleエラー
    "W",      # pycodestyle警告
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG001", # 関数内の未使用引数
    "T201",   # print文を許可しない
]
ignore = [
    "B008",  # 引数のデフォルト値で関数呼び出しを行わない
    "W191",  # インデントにタブが含まれる
    "B904",  # from eなしで例外を発生させることを許可(HTTPException用)
]

[tool.ruff.lint.mccabe]
max-complexity = 10
