[tool.mypy]
strict = true
exclude = ["venv", ".venv", "third_party"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 88  # Blackのデフォルトと同じ

[tool.ruff.lint]
select = [
    "E",      # pycodestyleエラー
    "W",      # pycodestyle警告
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG001", # 関数内の未使用引数
    "T201",   # print文を許可しない
]
ignore = [
    "B008",  # 引数のデフォルト値で関数呼び出しを行わない
    "W191",  # インデントにタブが含まれる
    "B904",  # from eなしで例外を発生させることを許可(HTTPException用)
]

[tool.ruff.lint.mccabe]
max-complexity = 10
